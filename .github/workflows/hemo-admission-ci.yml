name: HEMO admission CI
on:
  push:
    branches: [feature/st-01-st-02-admission, feature/st-03-blood-requests, feature/st-04-blood-bank, feature/st-05-transfusion, feature/st-06-hemovigilance, feature/st-07-quality-management, feature/st-08-delivery, feature/st-09-dashboards]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Current Angular 19 foundation and HEMO model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --no-audit --no-fund
      - run: npm run test:hemo
      - run: npm test -- --watch=false --browsers=ChromeHeadless
        timeout-minutes: 5
      - run: npm run build
  st09-browser-baseline:
    name: ST09 browser regression (pre-R01 snapshot only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # R01 reactivates the company bootstrap; current HEMO routes are not wired yet.
      # Preserve the previously green ST09 browser regression on its immutable source.
      # This job is NOT an integration test of the current Angular 19 app.
      - uses: actions/checkout@v4
        with:
          ref: c4a792aaa7f6fe9c541b66ab73f32d076df71f82
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        timeout-minutes: 10

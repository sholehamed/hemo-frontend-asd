
<div class="flex flex-col gap-2 ">
    <label [class]="(Submitted&&Input.invalid)?'error':''">{{Label}}</label>
    <p-password
        #Input="ngModel" [name]="Name" [required]="Required" [toggleMask]="true" [class]="(Submitted==true&&Input.invalid)?'ng-invalid ng-dirty w-full':'w-full'"
        (ngModelChange)="OnDataValueChange($event)" [feedback]="feedback"
        [(ngModel)]="Data" promptLabel="رمز عبور خود را وارد نمایید" weakLabel="ضعیف" mediumLabel="متوسط" strongLabel="عالی" />
    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['required']">{{Label}} اجباری می باشد.</span>
</div>

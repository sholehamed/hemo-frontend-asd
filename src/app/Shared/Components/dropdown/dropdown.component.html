
<div class="flex flex-col gap-2">
    <ng-container *ngIf="ViewInit">
        <label for="" [class]="(Submitted&&Input.invalid)?'error':''">{{Label}} <span *ngIf="Required==true&&ReadOnly==false" class="RequiredStar">*</span></label>
        <p-dropdown [disabled]="ReadOnly"   [id]="Name" [name]="Name"   #Input="ngModel" ngModel [required]="Required"
                    [class]="(Submitted==true&&Input.invalid)?'ng-invalid ng-dirty':''"
                    (ngModelChange)="ngModelChange($event)"
                    [options]="Options" [(ngModel)]="SelectedData" [optionLabel]="OptionName" [filter]="filter" [filterBy]="OptionName" [showClear]="false" [placeholder]="Label +' را انتخاب کنید'">
            <ng-template pTemplate="selectedItem">
                <div class="option-item option-item-value"[dir]="Direction"  *ngIf="SelectedData">

                    <div >{{SelectedData[OptionName]}}</div>
                </div>
            </ng-template>
            <ng-template let-Item pTemplate="item">
                <div class="option-item" [dir]="Direction">

                    <div>{{Item[OptionName]}}</div>
                </div>
            </ng-template>
        </p-dropdown>
        <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['required']">{{Label}} اجباری می باشد.</span>

    </ng-container>
</div>

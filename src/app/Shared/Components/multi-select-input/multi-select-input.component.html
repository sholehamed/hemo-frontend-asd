
<div class="flex flex-col gap-2">
    <label for="" [class]="(Submitted&&Input.invalid)?'error':''">{{Label}} <span *ngIf="Required==true" class="RequiredStar">*</span></label>
    <p-multiSelect display="chip" [id]="Name" [name]="Name"   #Input="ngModel" ngModel [required]="Required"
                   [class]="(Submitted==true&&Input.invalid)?'ng-invalid ng-dirty':''"
                   (ngModelChange)="ngModelChange($event)"
                   [options]="Options" [(ngModel)]="SelectedData" [optionLabel]="OptionName" [filter]="filter" [filterBy]="OptionName"  [placeholder]="Label +' را انتخاب کنید.'">
        <!-- <ng-template pTemplate="selectedItem">
            <div class="option-item option-item-value" *ngIf="SelectedData">

                <div>{{SelectedData[DataLabelName]}}</div>
            </div>
        </ng-template> -->
        <ng-template let-Item pTemplate="item">
            <div class="option-item">

                <div>{{Item[OptionName]}}</div>
            </div>
        </ng-template>
    </p-multiSelect>
    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['required']">{{Label}} اجباری می باشد.</span>
</div>

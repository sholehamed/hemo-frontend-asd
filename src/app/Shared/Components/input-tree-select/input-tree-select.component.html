<div class="flex flex-col gap-2">
    <label for="" [class]="(Submitted&&Input.invalid)?'error':''">{{Label}} <span *ngIf="Required==true"
            class="RequiredStar">*</span></label>

    <p-treeSelect [appendTo]="appendTo" [id]="Name" [name]="Name" #Input="ngModel" ngModel [required]="Required"
        (ngModelChange)="ngModelChange($event)" [class]="(Submitted==true&&Input.invalid)?'ng-invalid ng-dirty':''"
        [options]="Options" [(ngModel)]="SelectedData" [filter]="filter" [showClear]="false"
        [placeholder]="Label +' را انتخاب کنید'" class="md:w-20rem w-full" containerStyleClass="w-full"
        [options]="Options" placeholder="Select Item"></p-treeSelect>


    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['required']">{{Label}} اجباری می
        باشد.</span>
</div>

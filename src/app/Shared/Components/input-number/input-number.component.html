
<div class="flex flex-col gap-2">
    <label *ngIf="Label!=null&&Label!=''" [class]="(Submitted&&Input.invalid)?'error':''">{{Label}} <span *ngIf="Required==true&&ReadOnly==false" class="RequiredStar">*</span> </label>

    <p-inputNumber
        [dir]="Direction" (ngModelChange)="OnDataValueChange($event)"
        #Input="ngModel" ngModel [minlength]="minlength" [maxlength]="maxlength" [name]="Name"
        [class]="(Submitted==true&&Input.invalid)?'ng-invalid ng-dirty':''"

        [placeholder]="Placeholder" [disabled]="ReadOnly" [(ngModel)]="Data" mode="decimal" [required]="Required" [inputId]="Name" [useGrouping]="useGrouping"> </p-inputNumber>

    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['required']">{{Label}} اجباری می باشد.</span>
    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['maxlength']">{{Label}} حداکثر {{maxlength}} کاراکتر می تواند باشد</span>
    <span class="error" *ngIf="Submitted==true&&Input.invalid &&Input.errors!['minlength']">{{Label}} حداقل {{minlength}} کاراکتر باید باشد</span>
</div>

<p-panel [header]="Name">

    <p-table showGridlines currentPageReportTemplate="نمایش {first} تا {last} از {totalRecords} رکورد" [showCurrentPageReport]="true"
        [value]="PaginatedList.data" dataKey="guid" [rows]="10" [rowHover]="true"
        [rowsPerPageOptions]="[10, 25, 50,(PaginatedList.totalCount>100)?PaginatedList.totalCount:100]"
        [paginator]="true" [lazy]="true" (onLazyLoad)="onLazyLoad($event)" (onFilter)="onFilter($event)"
        [totalRecords]="PaginatedList.totalCount" (onSort)="onSort($event)" [tableStyle]="{'min-width': '50rem'}"
        [loading]="loading" [showLoader]="false" (onPage)="onPage($event)">

        <ng-template #caption>
            <div class="flex">
                <ng-container *ngTemplateOutlet="Actions"></ng-container>
            </div>
        </ng-template>

        <ng-template #header>

            <ng-container *ngIf="Header;else defaultHeader">
                <ng-container *ngTemplateOutlet="Header"></ng-container>
            </ng-container>
            <ng-template #defaultHeader>
                <tr>
                    <th>ردیف</th>
                    <ng-container *ngFor="let Config of TableConfig">
                        <th [pSortableColumn]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name">
                            {{Config.PersianName}}

                            <ng-container [ngSwitch]="Config.FilterType">

                                <p-columnFilter *ngSwitchCase="1" type="text"
                                    [field]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name" display="menu"
                                    [showOperator]="false" [showAddButton]="false"  matchMode="contains"
                                    [placeholder]="'جستجو بر اساس '+Config.PersianName"></p-columnFilter>

                                <p-columnFilter *ngSwitchCase="2" type="numeric"
                                    [field]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name" display="menu"
                                    [showOperator]="false" [showAddButton]="false"
                                    [placeholder]="'جستجو بر اساس '+Config.PersianName"></p-columnFilter>

                                <p-columnFilter *ngSwitchCase="3" type="date"
                                    [field]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name" display="menu"
                                    [showOperator]="false" [showAddButton]="false"
                                    [placeholder]="'جستجو بر اساس '+Config.PersianName"></p-columnFilter>

                                <p-columnFilter *ngSwitchCase="4" type="boolean" [matchMode]="'equals'"
                                    [field]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name"
                                    display="menu" />

                            </ng-container>
                   
                            <p-sortIcon [field]="(Config.FilterTypeBy!='')?Config.FilterTypeBy:Config.Name" />
                        </th>
                    </ng-container>

                </tr>
            </ng-template>



        </ng-template>


        <ng-template #body let-Item let-rowIndex="rowIndex">

            <ng-container *ngIf="Body;else defaultBody">
                <ng-container *ngTemplateOutlet="Body; context:Item"></ng-container>
            </ng-container>
            <ng-template #defaultBody>
                <tr>
                    <td>{{rowIndex+1}}</td>
                    <ng-container *ngFor="let Config of TableConfig">
                        <ng-container *ngIf="Config.Name!=''">
                            <td *ngIf="Config.ShowInRow==true" dir="ltr" class="text-center">
                                <ng-container [ngSwitch]="Config.FilterType">
                                    <span *ngSwitchCase="3"> {{ Item[Config.Name]|PersianDate }}</span>
                                    <ng-container *ngSwitchCase="4">
                                        <i class="pi" [ngClass]="{
                                                                'text-green-500 pi-check-circle': Item[Config.Name],
                                                                'text-red-500 pi-times-circle': !Item[Config.Name]
                                                            }"></i>

                                    </ng-container>
                                    <span *ngSwitchDefault>{{ Item[Config.Name] }}</span>
                                </ng-container>
                            </td>
                        </ng-container>

                    </ng-container>
                    <ng-container *ngTemplateOutlet="RowActions ; context:{ $implicit: Item }"></ng-container>


                </tr>
            </ng-template>

        </ng-template>
        <ng-template #loadingbody let-columns="columns">
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
            <tr style="height:46px">
                <td>
                    <p-skeleton />
                </td>
                <td *ngFor="let col of TableConfig; let even = even">
                    <p-skeleton />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td [colSpan]="TableConfig.length+1">اطلاعات یافت نشد</td>
            </tr>
        </ng-template>
    </p-table>
</p-panel>

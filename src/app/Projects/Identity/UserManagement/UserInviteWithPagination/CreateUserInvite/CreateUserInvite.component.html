<p-panel [header]="'ثبت دعوت نامه جدید'">
    <form #Form="ngForm">
        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string
                [Label]="'ایمیل/موبایل/نام کاربری'"
                [Placeholder]="'ایمیل/موبایل/نام کاربری'"
                [ReadOnly]="false"
                [Required]="true"
                [Data]="CreateUserInviteCommand.userInfo"
                (DataValueChange)="CreateUserInviteCommand.userInfo=$event"
                [Submitted]="Form.submitted"
                
                
                ></app-input-string>
            </div>
        </div>
        <hr>
        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-6 text-center">
                <p-button type="Submit" (onClick)="Form.valid && (ChangePage?Update():Insert()) " label="ذخیره"
                    severity="success" />
            </div>
            <div class="col-span-6 text-center">
                <p-button type="button" (onClick)="Back()" routerLinkActive="router-link-active" label="برگشت"
                    severity="danger" />
            </div>
        </div>
    </form>
</p-panel>

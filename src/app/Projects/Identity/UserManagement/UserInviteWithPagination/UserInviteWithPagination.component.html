
<app-base
    [Name]="'مدیریت لیست دعوت نامه ها'"
    [DataUrl]="'Identity/UserInvite/BindPaging'"
    [TableConfig]="TableConfig">
    <ng-template #Actions>
        <p-button [routerLink]="['/Identity/UserManagement/UserInvite/CreateUserInvite']" label="ثبت جدید" [raised]="true"
            severity="success" />
    </ng-template>
    <ng-template #RowActions let-Item>
        <td>
           <p-button (onClick)="Delete(Item)" pTooltip="حذف" icon="pi pi-trash" [rounded]="true" severity="danger" />
        </td>

    </ng-template>
</app-base>

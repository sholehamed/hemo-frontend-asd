<div class="body">
    <div class="chat-wrapper">
        <!-- هدر -->
        <header class="chat-header">
            <div class="chat-header-info">
                <p-button icon="pi pi-angle-right" (onClick)="Onclose()" [rounded]="true" severity="warn" />

                <div class="ticket-details">
                    <h2>{{TicketFindByIdDTO.title}}</h2>
                    <span class="ticket-status">● {{TicketFindByIdDTO.ticketStatusName}}</span>
                </div>
            </div>
            <div style="color: #64748b; font-size: 0.85rem;">تیکت #{{TicketFindByIdDTO.ticketNumber}}

                <br>
                <br>
                <p-button (onClick)="CloseTicket()" label="بستن تیکت"  [rounded]="true" severity="warn" size="small"/>


            </div>
        </header>


        <p-scrollPanel #scrollPanel [style]="{ width: '100%', height: 'calc(100vh - 290px)' }">
            <ng-container *ngFor="let item of Messages">
                <div [class]="item.isUserMessage==true?'msg-row user':'msg-row support'">
                    <div class="msg-bubble" *ngIf="item.isFile==false">
                        {{item.message}}
                        <span class="msg-time">{{item.sendDate!|PersianDate}}</span>
                    </div>
                    <div class="msg-bubble" *ngIf="item.isFile==true" (click)="downloadFile(item)">
                        <div class="native-file-wrapper" title="دانلود فایل">
                            <div class="native-file-icon">
                                <!-- آیکون دانلود/فایل -->
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="12" y1="18" x2="12" y2="12"></line>
                                    <polyline points="9 15 12 18 15 15"></polyline>
                                </svg>
                            </div>
                            <div class="native-file-details">
                                <span class="native-file-name">فایل</span> <!-- می‌توانید متغیر بایند کنید -->

                            </div>
                        </div>
                        <span class="msg-time">{{item.sendDate!|PersianDate}}</span>
                        <p-progressBar *ngIf="item.downloading==true" mode="indeterminate"
                            [style]="{ height: '6px' }" />

                    </div>

                </div>


            </ng-container>

        </p-scrollPanel>

        <!-- ورودی -->
        <footer class="chat-footer">
            <form #Form="ngForm" (submit)="SendMessage()">
                <div class="input-group">
                    <button [disabled]="uploading" type="button" class="attach-btn" (click)="fileInput.click()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                        </svg>
                    </button>
                    <div class="input">
                        <app-input-string [Label]="''" Placeholder="پیام خود را بنویسید..." [ReadOnly]="uploading"
                            [Required]="false" [Data]="CreateTicketMessageCommand.message"
                            (DataValueChange)="CreateTicketMessageCommand.message=$event"
                            [Submitted]="Form.submitted"></app-input-string>
                    </div>
                    <input type="file" #fileInput style="display: none;" (change)="onFileSelected($event)">

                    <p-button icon="pi pi-check" type="submit" [rounded]="true" severity="help" />


                </div>
                <br>
                <p-progressBar *ngIf="uploading" [value]="progress"></p-progressBar>

            </form>

        </footer>
    </div>
</div>

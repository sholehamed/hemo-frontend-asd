<p-panel [header]="'ثبت پکیج های شرکت جدید'">
    <form #Form="ngForm">
        <div class="grid grid-cols-12 gap-8">            
            <div class="col-span-12 md:col-span-6 lg:col-span-6 xl:col-span-6">
                <app-dropdown
                    [Label]="'پکیج'"
                    [ReadOnly]="false"
                    [Required]="true"
                    [Options]="[]"
                    [OptionsUrl]="'/Identity/Package/FindAll'"
                    (DataValueChange)="CreateOrglocationPackageCommand.packageGUID=$event"
                    [Data]="CreateOrglocationPackageCommand.packageGUID"
                    [DataIdName]="'guid'"
                    [OptionName]="'name'"
                    [Submitted]="Form.submitted"
                ></app-dropdown>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-date-input
                    [Label]="'اعتبار'"
                    [ReadOnly]="false"
                    [Required]="true"
                    [Data]="CreateOrglocationPackageCommand.expiryDate"
                    (DataValueChange)="CreateOrglocationPackageCommand.expiryDate=$event"
                    [Submitted]="Form.submitted"
                    [MinDate]="_dateNow"
                ></app-date-input>
            </div>
        </div>
        <hr>
        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-6 text-center">
                <p-button type="Submit" (onClick)="Form.valid && (ChangePage?Update():Insert()) " label="ذخیره"
                    severity="success" />
            </div>
            <div class="col-span-6 text-center">
                <p-button type="button" (onClick)="Back()" routerLinkActive="router-link-active" label="برگشت"
                    severity="danger" />
            </div>
        </div>
    </form>
</p-panel>

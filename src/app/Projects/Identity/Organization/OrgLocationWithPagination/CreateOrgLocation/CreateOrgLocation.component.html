<p-panel [header]="'ثبت شرکت جدید'">
    <form #Form="ngForm">
        <div class="grid grid-cols-12 gap-8">

     
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'عنوان'" [Placeholder]="'عنوان'" [ReadOnly]="false" [Required]="true"
                    [Data]="CreateOrgLocationCommand.name" (DataValueChange)="CreateOrgLocationCommand.name=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>

            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'آدرس'" [Placeholder]="'آدرس'" [ReadOnly]="false" [Required]="false"
                    [Data]="CreateOrgLocationCommand.address"
                    (DataValueChange)="CreateOrgLocationCommand.address=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'تلفن'" [Placeholder]="'تلفن'" [ReadOnly]="false" [Required]="false"
                    [Data]="CreateOrgLocationCommand.tell" (DataValueChange)="CreateOrgLocationCommand.tell=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'فکس'" [Placeholder]="'فکس'" [ReadOnly]="false" [Required]="false"
                    [Data]="CreateOrgLocationCommand.fax" (DataValueChange)="CreateOrgLocationCommand.fax=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'ایمیل'" [Placeholder]="'ایمیل'" [ReadOnly]="false" [Required]="false"
                    [Data]="CreateOrgLocationCommand.email" (DataValueChange)="CreateOrgLocationCommand.email=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string [Label]="'آدرس وبسایت'" [Placeholder]="'آدرس وبسایت'" [ReadOnly]="false"
                    [Required]="false" [Data]="CreateOrgLocationCommand.url"
                    (DataValueChange)="CreateOrgLocationCommand.url=$event"
                    [Submitted]="Form.submitted"></app-input-string>
            </div>
        </div>
        <hr>
        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-6 text-center">
                <p-button type="Submit" (onClick)="Form.valid && (ChangePage?Update():Insert()) " label="ذخیره"
                    severity="success" />
            </div>
            <div class="col-span-6 text-center">
                <p-button type="button" (onClick)="Back()" routerLinkActive="router-link-active" label="برگشت"
                    severity="danger" />
            </div>
        </div>
    </form>
</p-panel>

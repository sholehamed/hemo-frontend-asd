<p-panel [header]="'ثبت منو جدید'">
    <form #Form="ngForm">
        <div class="grid grid-cols-12 gap-8">

     
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string
                [Label]="'عنوان'"
                [Placeholder]="'عنوان'"
                [ReadOnly]="false"
                [Required]="true"
                [Data]="CreateMenuCommand.label"
                (DataValueChange)="CreateMenuCommand.label=$event"
                [Submitted]="Form.submitted"


                ></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string
                [Label]="'آیکون'"
                [Placeholder]="''"
                [ReadOnly]="false"
                [Required]="false"
                [Direction]="'ltr'"
                [Data]="CreateMenuCommand.icon"
                (DataValueChange)="CreateMenuCommand.icon=$event"
                [Submitted]="Form.submitted"


                ></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-string
                [Label]="'آدرس'"
                [Placeholder]="''"
                [ReadOnly]="false"
                [Required]="false"
                [Direction]="'ltr'"
                [Data]="CreateMenuCommand.routerLink"
                (DataValueChange)="CreateMenuCommand.routerLink=$event"
                [Submitted]="Form.submitted"


                ></app-input-string>
            </div>
            <div class="col-span-12 md:col-span-6 lg:col-span-4 xl:col-span-3">
                <app-input-number
                    [Label]="'ترتیب نمایش'"
                    [Placeholder]="'ترتیب نمایش'"
                    [ReadOnly]="false"
                    [Required]="false"
                    [useGrouping]="false"
                    [Data]="CreateMenuCommand.gorder"
                    (DataValueChange)="CreateMenuCommand.gorder=$event"
                    [Submitted]="Form.submitted"


                ></app-input-number>
            </div>
        </div>
        <hr>
        <div class="grid grid-cols-12 gap-8">
            <div class="col-span-6 text-center">
                <p-button type="Submit" (onClick)="Form.valid && (ChangePage?Update():Insert()) " label="ذخیره"
                    severity="success" />
            </div>
            <div class="col-span-6 text-center">
                <p-button type="button" (onClick)="Back()" routerLinkActive="router-link-active" label="برگشت"
                    severity="danger" />
            </div>
        </div>
    </form>
</p-panel>
